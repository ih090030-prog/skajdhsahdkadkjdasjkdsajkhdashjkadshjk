<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Loading page…</title>
  <link rel="stylesheet" href="/scramjet-client/index.css" />
  <script src="/bootstrap-init.js"></script>
</head>
<body>
  <main id="sj-viewport" aria-label="Web page">
    <div id="sj-loading" role="status">Loading…</div>
    <section id="sj-error-screen" role="alert" hidden>
      <h1>Couldn’t load this page</h1>
      <p id="sj-error"></p>
      <details id="sj-error-details-wrap">
        <summary>Technical details</summary>
        <pre id="sj-error-code"></pre>
      </details>
    </section>
    <div id="sj-frame-wrapper">
      <div id="sj-bar"><a href="/">← ESOK</a><span id="sj-frame-url"></span></div>
      <iframe id="sj-frame" title="Website" allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad; microphone; camera" referrerpolicy="no-referrer"></iframe>
    </div>
  </main>
  <script src="/scramjet-client/index.js"></script>
</body>
</html>
